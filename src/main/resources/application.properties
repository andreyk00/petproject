# ===============================
# Application Configuration
# ===============================
spring.application.name=petproject
server.port=9000

# ===============================
# Logging Configuration
# ===============================
logging.level.org.apache.kafka.clients=ERROR

# ===============================
# Docker Compose Configuration
# ===============================
# Path to the docker-compose file for Kafka and other services
spring.docker.compose.file=./docker-compose.yaml

# ===============================
# Kafka Configuration
# ===============================
# Kafka bootstrap servers
spring.kafka.bootstrap-servers=localhost:9092

# Kafka topic name
spring.kafka.topic=inventory-event

# Kafka topic retention time (24 hours in milliseconds)
kafka.topic.retention.ms=86400000

# ===============================
# Kafka Consumer Configuration
# ===============================
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=task-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.IntegerDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ===============================
# Kafka Producer Configuration
# ===============================
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.IntegerSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer